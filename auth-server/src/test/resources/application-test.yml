spring:
  datasource:
    url: jdbc:h2:mem:auth_server_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

eureka:
  client:
    enabled: false

jwt:
  secret: test-auth-server-secret-key-with-at-least-32-chars
  expiration: 86400000
