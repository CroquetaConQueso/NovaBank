server:
  port: 8086

spring:
  application:
    name: documento-service
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    function:
      definition: generarJustificanteOperacion
    stream:
      bindings:
        generarJustificanteOperacion-in-0:
          destination: novabank.operaciones.completadas
          group: documento-service
          content-type: application/json
      kafka:
        binder:
          brokers: localhost:9092

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

novabank:
  aws:
    region: eu-west-1
    endpoint-override: http://localhost:4566
  s3:
    bucket-justificantes: novabank-justificantes
    presigned-url-ttl: PT15M
  storage:
    type: s3
