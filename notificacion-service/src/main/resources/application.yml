server:
  port: 8085

spring:
  application:
    name: notificacion-service
  config:
    import: optional:configserver:http://localhost:8888
  kafka:
    bootstrap-servers: localhost:9092
  cloud:
    function:
      definition: notificarBienvenida;notificarSaldoBajo;notificarOperacionSospechosa
    stream:
      bindings:
        notificarBienvenida-in-0:
          destination: novabank.clientes.registrados
          group: notificacion-service
          content-type: application/json
        notificarSaldoBajo-in-0:
          destination: novabank.alertas.saldo-bajo
          group: notificacion-service
          content-type: application/json
        notificarOperacionSospechosa-in-0:
          destination: novabank.alertas.operaciones-sospechosas
          group: notificacion-service
          content-type: application/json
      kafka:
        binder:
          brokers: localhost:9092

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-},spanId=%X{spanId:-}]"
