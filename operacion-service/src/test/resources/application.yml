spring:
  application:
    name: operacion-service
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql
  cloud:
    config:
      enabled: false

eureka:
  client:
    enabled: false

novabank:
  aws:
    region: eu-west-1
    endpoint-override: http://localhost:4566
  lambda:
    comision-function-name: novabank-comision
  kafka-streams:
    operaciones-sospechosas:
      enabled: false
