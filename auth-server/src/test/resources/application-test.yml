spring:
  r2dbc:
    url: r2dbc:h2:mem:///auth_server_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql

eureka:
  client:
    enabled: false

jwt:
  secret: test-auth-server-secret-key-with-at-least-32-chars
  expiration: 86400000
