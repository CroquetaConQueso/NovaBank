spring:
  application:
    name: cliente-service
  datasource:
    url: ${CLIENTE_DB_URL:jdbc:postgresql://localhost:5432/novabank_clientes}
    username: ${CLIENTE_DB_USERNAME:postgres}
    password: ${CLIENTE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081
