services:
  postgres:
    image: postgres:16-alpine
    container_name: novabank-postgres
    environment:
      POSTGRES_DB: novabank
      POSTGRES_USER: novabank
      POSTGRES_PASSWORD: novabank
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novabank -d novabank"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - novabank-network

  kafka:
    image: apache/kafka:3.7.0
    container_name: novabank-kafka
    hostname: kafka
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - novabank-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: novabank-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: novabank
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - novabank-network

  localstack:
    image: localstack/localstack:3.8
    container_name: novabank-localstack
    environment:
      SERVICES: s3,lambda
      AWS_DEFAULT_REGION: eu-west-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      NOVABANK_JUSTIFICANTES_BUCKET: novabank-justificantes
    ports:
      - "4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack
      - ./localstack-init/01-crear-buckets.sh:/etc/localstack/init/ready.d/01-crear-buckets.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - novabank-network

  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    image: novabank/eureka-server:local
    container_name: novabank-eureka-server
    environment:
      SERVER_PORT: 8761
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
    ports:
      - "8761:8761"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - novabank-network

  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    image: novabank/config-server:local
    container_name: novabank-config-server
    environment:
      SERVER_PORT: 8888
      SPRING_PROFILES_ACTIVE: native
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: classpath:/config-repo-docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    ports:
      - "8888:8888"
    depends_on:
      - eureka-server
    networks:
      - novabank-network

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    image: novabank/api-gateway:local
    container_name: novabank-api-gateway
    environment:
      SERVER_PORT: 8080
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server
      - config-server
    networks:
      - novabank-network

  auth-server:
    build:
      context: .
      dockerfile: auth-server/Dockerfile
    image: novabank/auth-server:local
    container_name: novabank-auth-server
    environment:
      SERVER_PORT: 9000
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/novabank
      SPRING_R2DBC_USERNAME: novabank
      SPRING_R2DBC_PASSWORD: novabank
      SPRING_SQL_INIT_MODE: always
      JWT_SECRET: docker-local-auth-server-secret-key-with-at-least-32-chars
    ports:
      - "9000:9000"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
    networks:
      - novabank-network

  cliente-service:
    build:
      context: .
      dockerfile: cliente-service/Dockerfile
    image: novabank/cliente-service:local
    container_name: novabank-cliente-service
    environment:
      SERVER_PORT: 8081
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/novabank
      SPRING_R2DBC_USERNAME: novabank
      SPRING_R2DBC_PASSWORD: novabank
      SPRING_SQL_INIT_MODE: always
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS: kafka:9092
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
    networks:
      - novabank-network

  cuenta-service:
    build:
      context: .
      dockerfile: cuenta-service/Dockerfile
    image: novabank/cuenta-service:local
    container_name: novabank-cuenta-service
    environment:
      SERVER_PORT: 8082
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/novabank
      SPRING_R2DBC_USERNAME: novabank
      SPRING_R2DBC_PASSWORD: novabank
      SPRING_SQL_INIT_MODE: always
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS: kafka:9092
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
    networks:
      - novabank-network

  operacion-service:
    build:
      context: .
      dockerfile: operacion-service/Dockerfile
    image: novabank/operacion-service:local
    container_name: novabank-operacion-service
    environment:
      SERVER_PORT: 8083
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/novabank
      SPRING_R2DBC_USERNAME: novabank
      SPRING_R2DBC_PASSWORD: novabank
      SPRING_SQL_INIT_MODE: always
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS: kafka:9092
      NOVABANK_KAFKA_STREAMS_OPERACIONES_SOSPECHOSAS_BOOTSTRAP_SERVERS: kafka:9092
      NOVABANK_AWS_REGION: eu-west-1
      NOVABANK_AWS_ENDPOINT_OVERRIDE: http://localstack:4566
      NOVABANK_LAMBDA_COMISION_FUNCTION_NAME: novabank-comision
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: eu-west-1
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      localstack:
        condition: service_healthy
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
    networks:
      - novabank-network

  exchange-rate-mock-service:
    build:
      context: .
      dockerfile: exchange-rate-mock-service/Dockerfile
    image: novabank/exchange-rate-mock-service:local
    container_name: novabank-exchange-rate-mock-service
    environment:
      SERVER_PORT: 8084
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    ports:
      - "8084:8084"
    depends_on:
      - eureka-server
      - config-server
    networks:
      - novabank-network

  notificacion-service:
    build:
      context: .
      dockerfile: notificacion-service/Dockerfile
    image: novabank/notificacion-service:local
    container_name: novabank-notificacion-service
    environment:
      SERVER_PORT: 8085
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
    networks:
      - novabank-network

  documento-service:
    build:
      context: .
      dockerfile: documento-service/Dockerfile
    image: novabank/documento-service:local
    container_name: novabank-documento-service
    environment:
      SERVER_PORT: 8086
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS: kafka:9092
      NOVABANK_AWS_REGION: eu-west-1
      NOVABANK_AWS_ENDPOINT_OVERRIDE: http://localstack:4566
      NOVABANK_S3_BUCKET_JUSTIFICANTES: novabank-justificantes
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: eu-west-1
    ports:
      - "8086:8086"
    depends_on:
      kafka:
        condition: service_healthy
      localstack:
        condition: service_healthy
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
    networks:
      - novabank-network

networks:
  novabank-network:
    name: novabank-network

volumes:
  postgres-data:
  localstack-data:
