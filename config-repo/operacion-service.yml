spring:
  application:
    name: operacion-service
  datasource:
    url: ${OPERACION_DB_URL:jdbc:postgresql://localhost:5432/novabank_operaciones}
    username: ${OPERACION_DB_USERNAME:postgres}
    password: ${OPERACION_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8083
