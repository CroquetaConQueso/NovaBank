spring:
  application:
    name: cuenta-service
  datasource:
    url: ${CUENTA_DB_URL:jdbc:postgresql://localhost:5432/novabank_cuentas}
    username: ${CUENTA_DB_USERNAME:postgres}
    password: ${CUENTA_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8082
